[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-attack-forecasting"
version = "0.1.0"
description = "A Temporal Graph Neural Network (TGN) system for real-time cyber attack prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer" }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
]
